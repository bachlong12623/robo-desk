<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboDesk — Sơ đồ chân IO chi tiết</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0b0f14; --panel: #151c28; --card: #1c2636; --border: #2d3f58;
      --text: #eef4fc; --muted: #8fa3bf;
      --pwr: #f87171; --i2c: #4ade80; --spi: #c084fc; --i2s: #22d3ee;
      --motor: #fbbf24; --gpio: #94a3b8; --hl: #fde047;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    header { padding: 0.75rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 600; margin-right: auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .tabs { display: flex; gap: 0.25rem; }
    .tab, .btn, select, input[type=search] {
      padding: 0.35rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.78rem; cursor: pointer;
    }
    .tab.on, .btn.on { background: #2563eb; border-color: #2563eb; }
    input[type=search] { width: 160px; cursor: text; }
    .chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; color: var(--muted); }
    .chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
    .workspace { overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
    .view { display: none; flex: 1; min-height: 0; overflow: auto; }
    .view.on { display: flex; flex-direction: column; }
    #harness-wrap { flex: 1; overflow: auto; position: relative; background: #0d1219; }
    #harness { display: block; min-width: 1100px; min-height: 900px; }
    .zoom-bar { padding: 0.4rem 0.75rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: center; font-size: 0.75rem; color: var(--muted); }
    aside { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 0.75rem; }
    aside h2 { font-size: 0.9rem; margin-bottom: 0.5rem; }
    aside h3 { font-size: 0.75rem; color: var(--muted); margin: 0.75rem 0 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .pin-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.35rem; align-items: center; padding: 0.3rem 0.4rem; border-radius: 4px; font-size: 0.72rem; border: 1px solid transparent; cursor: pointer; }
    .pin-row:hover, .pin-row.hl { background: #243044; border-color: var(--border); }
    .pin-row .esp { text-align: right; color: #93c5fd; font-family: ui-monospace, monospace; }
    .pin-row .mod { color: #fcd34d; font-family: ui-monospace, monospace; }
    .pin-row .arr { color: var(--muted); }
    table.net { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    table.net th, table.net tr.data td { border: 1px solid var(--border); padding: 0.35rem 0.45rem; text-align: left; }
    table.net th { background: #243044; color: var(--muted); position: sticky; top: 0; }
    table.net tr.data { cursor: pointer; }
    table.net tr.data:hover, table.net tr.data.hl { background: #243044; }
    .mermaid-wrap { padding: 1rem; overflow: auto; flex: 1; }
    .mermaid { background: #fff; border-radius: 8px; padding: 1rem; min-height: 200px; }
    .esp-pin { cursor: pointer; }
    .esp-pin:hover circle { r: 7; }
    .esp-pin.used circle { stroke-width: 2; }
    .esp-pin.unused { opacity: 0.25; }
    .wire-path { fill: none; stroke-width: 2; cursor: pointer; opacity: 0.7; }
    .wire-path:hover, .wire-path.hl { opacity: 1; stroke-width: 3.5; }
    .wire-path.dim { opacity: 0.08; }
    .wire-label { font-size: 9px; fill: var(--text); pointer-events: none; font-family: ui-monospace, monospace; }
    .mod-box { cursor: pointer; }
    .mod-box:hover rect { filter: brightness(1.12); }
    .mod-box.hl rect { stroke: var(--hl); stroke-width: 2.5; }
    .bus-filter { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.5rem; }
    .bus-filter label { font-size: 0.7rem; display: flex; align-items: center; gap: 0.25rem; cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 4px; border: 1px solid var(--border); }
    .bus-filter input { accent-color: #2563eb; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } aside { max-height: 35vh; border-left: none; border-top: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <h1>RoboDesk — Sơ đồ chân IO (ESP32 ↔ từng cổng module)</h1>
    <div class="tabs">
      <button class="tab on" data-view="harness">Sơ đồ dây chân</button>
      <button class="tab" data-view="netlist">Bảng netlist</button>
      <button class="tab" data-view="mermaid">Mermaid</button>
      <button class="tab" data-view="power">Nguồn 2S</button>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Tìm GPIO / SDA / AIN1…">
      <select id="mod-filter"><option value="">Tất cả module</option></select>
      <button class="btn" id="reset-hl">Bỏ chọn</button>
    </div>
    <div class="chip"><i style="background:var(--pwr)"></i>Nguồn</div>
    <div class="chip"><i style="background:var(--i2c)"></i>I2C</div>
    <div class="chip"><i style="background:var(--spi)"></i>SPI</div>
    <div class="chip"><i style="background:var(--i2s)"></i>I2S</div>
    <div class="chip"><i style="background:var(--motor)"></i>Motor</div>
    <div class="chip"><i style="background:var(--gpio)"></i>GPIO</div>
  </header>
  <main>

      </div>

          <line x1="210" y1="50" x2="210" y2="75" stroke="#8fa3bf" marker-end="url(#a)"/>
          <rect x="130" y="75" width="160" height="45" rx="6" fill="#422006" stroke="#fbbf24" stroke-width="2"/>

          <text x="210" y="112" text-anchor="middle" fill="#8fa3bf" font-size="9">PACK+ / PACK−</text>
          <line x1="210" y1="120" x2="210" y2="145" stroke="#f87171" stroke-width="2"/>
          <rect x="165" y="145" width="90" height="32" rx="5" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
          <text x="210" y="165" text-anchor="middle" fill="#fecaca" font-size="11">Công tắc gạt</text>
          <line x1="210" y1="177" x2="210" y2="200" stroke="#f87171" stroke-width="2"/>
          <rect x="145" y="200" width="130" height="40" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
          <text x="210" y="218" text-anchor="middle" fill="#eef4fc" font-size="11">MP1584EN → 5.00V</text>
          <text x="210" y="232" text-anchor="middle" fill="#4ade80" font-size="10">OUT+ = bus 5V</text>
          <line x1="210" y1="240" x2="210" y2="270" stroke="#f87171" stroke-width="3"/>
          <rect x="60" y="270" width="300" height="28" rx="5" fill="#7f1d1d" stroke="#f87171"/>
          <text x="210" y="288" text-anchor="middle" fill="#fecaca" font-size="12" font-weight="bold">BUS 5V</text>
          <text x="90" y="320" text-anchor="middle" fill="#93c5fd" font-size="9">ESP VIN</text>
          <text x="150" y="320" text-anchor="middle" fill="#c084fc" font-size="9">WS2812 VCC</text>

          <line x1="90" y1="298" x2="90" y2="310" stroke="#f87171"/><line x1="150" y1="298" x2="150" y2="310" stroke="#f87171"/>
          <line x1="210" y1="298" x2="210" y2="310" stroke="#f87171"/><line x1="280" y1="298" x2="280" y2="310" stroke="#f87171"/>
          <rect x="80" y="340" width="260" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
          <text x="210" y="360" text-anchor="middle" fill="#93c5fd" font-size="10">ESP 3V3 (J1-1) → MPU,DHT,VL53,LCD,INMP441,DRV VCC</text>
          <text x="210" y="378" text-anchor="middle" fill="#8fa3bf" font-size="9">GND chung → tất cả GND</text>
          <rect x="100" y="410" width="220" height="55" rx="6" fill="#243044" stroke="#94a3b8"/>
          <text x="210" y="430" text-anchor="middle" fill="#eef4fc" font-size="10">Chia áp đo pin</text>
          <text x="210" y="448" text-anchor="middle" fill="#fcd34d" font-size="9">PACK+ ─[100k]─┬─ GPIO10 (J1-18)</text>
          <text x="210" y="462" text-anchor="middle" fill="#8fa3bf" font-size="9">              └──[33k]── GND</text>
          <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#8fa3bf"/></marker></defs>
        </svg>
      </div>
    </div>
    <aside>
      <h2 id="aside-title">Tất cả kết nối chân</h2>
      <div class="bus-filter" id="aside-bus"></div>
      <div id="aside-list"></div>
    </aside>
  </main>

    const ESP = { x: 480, y: 200, w: 140, h: 480 };
    const PIN_H = 17;
    const ESP_PINS = [
      { hdr:'J1', hole:1, y:0, label:'3V3', gpio:'3V3', used:true, bus:'pwr' },

      { hdr:'J1', hole:20, y:13, label:'GPIO12', gpio:'GPIO12', used:true, bus:'spi' },
      { hdr:'J1', hole:21, y:14, label:'GPIO13', gpio:'GPIO13', used:true, bus:'spi' },
      { hdr:'J1', hole:22, y:15, label:'GPIO14', gpio:'GPIO14', used:true, bus:'spi' },
      { hdr:'J1', hole:23, y:16, label:'5V', gpio:'5V', used:true, bus:'pwr' },
      { hdr:'J1', hole:24, y:17, label:'GND', gpio:'GND', used:true, bus:'pwr' },
      { hdr:'J3', hole:3, y:0, label:'GPIO1', gpio:'GPIO1', used:true, bus:'motor' },
      { hdr:'J3', hole:4, y:1, label:'GPIO2', gpio:'GPIO2', used:true, bus:'motor' },
      { hdr:'J3', hole:5, y:2, label:'GPIO42', gpio:'GPIO42', used:true, bus:'motor' },
      { hdr:'J3', hole:6, y:3, label:'GPIO41', gpio:'GPIO41', used:true, bus:'motor' },
      { hdr:'J3', hole:7, y:4, label:'GPIO40', gpio:'GPIO40', used:true, bus:'gpio' },
      { hdr:'J3', hole:9, y:5, label:'GPIO38', gpio:'GPIO38', used:true, bus:'spi' },
      { hdr:'J3', hole:15, y:6, label:'GPIO48', gpio:'GPIO48', used:true, bus:'spi' },
      { hdr:'J3', hole:17, y:7, label:'GPIO21', gpio:'GPIO21', used:true, bus:'spi' },
      { hdr:'J3', hole:18, y:8, label:'GND', gpio:'GND', used:true, bus:'pwr' },
    ];

    let state = { hl: null, mod: '', q: '', buses: new Set(Object.keys(BUS)), zoom: 1 };
    const svg = document.getElementById('harness');
    const modMap = Object.fromEntries(MODULES.map(m => [m.id, m]));

    function pinPos(pin, side) {
      const baseY = ESP.y + 36 + pin.y * PIN_H;
      if (side === 'left' || pin.hdr === 'J1') return { x: ESP.x, y: baseY };
      return { x: ESP.x + ESP.w, y: ESP.y + 36 + pin.y * PIN_H };
    }

    function modPinPos(mod, pinName, idx, total) {
      const side = mod.side;
      const py = mod.y + 28 + idx * 14;
      if (side === 'left') return { x: mod.x + mod.w, y: py };
      if (side === 'right') return { x: mod.x, y: py };
      if (side === 'top') return { x: mod.x + 20 + idx * 18, y: mod.y + mod.h };
      return { x: mod.x + mod.w / 2, y: mod.y };
    }

    function getModPins(modId) {
      const pins = [...new Set(NET.filter(n => n.mod === modId).map(n => n.pin))];
      return pins;
    }

    function espPinFor(net) {
      if (net.esp === '—') return null;
      return ESP_PINS.find(p => p.gpio === net.esp || (net.esp === 'VIN' && p.gpio === '5V'));
    }

    function filteredNet() {
      return NET.filter(n => {
        if (!state.buses.has(n.bus)) return false;
        if (state.mod && n.mod !== state.mod) return false;
        if (state.q) {
          const q = state.q.toLowerCase();
          const hay = `${n.esp} ${n.hdr} ${n.mod} ${n.pin} ${n.note}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function drawHarness() {
      svg.innerHTML = '';
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = '<marker id="arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5Z" fill="#8fa3bf"/></marker>';
      svg.appendChild(defs);

      const gWires = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      gWires.id = 'wires';
      const nets = filteredNet().filter(n => n.esp !== '—' && n.mod !== '*');

      nets.forEach(n => {
        const ep = espPinFor(n);
        if (!ep) return;
        const mod = modMap[n.mod];
        if (!mod) return;
        const pins = getModPins(n.mod);
        const idx = pins.indexOf(n.pin);
        if (idx < 0) return;
        const p0 = pinPos(ep, ep.hdr === 'J1' ? 'left' : 'right');
        const p1 = modPinPos(mod, n.pin, idx, pins.length);
        const mx = (p0.x + p1.x) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${p0.x},${p0.y} C${mx},${p0.y} ${mx},${p1.y} ${p1.x},${p1.y}`);
        path.setAttribute('stroke', BUS[n.bus].color);
        path.setAttribute('fill', 'none');
        path.classList.add('wire-path');
        path.dataset.id = n.id;
        const dim = state.hl && state.hl !== n.id && state.hl !== n.esp && state.hl !== n.mod;
        if (dim) path.classList.add('dim');
        if (state.hl === n.id || state.hl === n.esp || state.hl === n.mod) path.classList.add('hl');
        path.addEventListener('mouseenter', () => highlight('id', n.id));
        path.addEventListener('mouseleave', () => highlight(null));
        gWires.appendChild(path);

        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        lbl.setAttribute('x', (p0.x + p1.x) / 2);
        lbl.setAttribute('y', (p0.y + p1.y) / 2 - 4);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.classList.add('wire-label');
        lbl.setAttribute('opacity', dim ? 0.1 : 0.85);
        lbl.textContent = `${n.esp} ↔ ${n.pin}`;
        gWires.appendChild(lbl);
      });
      svg.appendChild(gWires);

      const gEsp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const body = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      body.setAttribute('x', ESP.x); body.setAttribute('y', ESP.y);
      body.setAttribute('width', ESP.w); body.setAttribute('height', ESP.h);
      body.setAttribute('rx', 10); body.setAttribute('fill', '#1e3a5f'); body.setAttribute('stroke', '#3b82f6'); body.setAttribute('stroke-width', 2);
      gEsp.appendChild(body);
      const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      title.setAttribute('x', ESP.x + ESP.w/2); title.setAttribute('y', ESP.y + 22);
      title.setAttribute('text-anchor', 'middle'); title.setAttribute('fill', '#eef4fc');
      title.setAttribute('font-size', '12'); title.setAttribute('font-weight', '600');
      title.textContent = 'ESP32-S3 DevKit N16R8';
      gEsp.appendChild(title);
      const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      sub.setAttribute('x', ESP.x + ESP.w/2); sub.setAttribute('y', ESP.y + 36);
      sub.setAttribute('text-anchor', 'middle'); sub.setAttribute('fill', '#8fa3bf'); sub.setAttribute('font-size', '9');
      sub.textContent = 'J1 ← trái · J3 → phải · USB dưới';
      gEsp.appendChild(sub);

      ESP_PINS.forEach(pin => {
        const side = pin.hdr === 'J1' ? 'left' : 'right';
        const pos = pinPos(pin, side);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.classList.add('esp-pin', pin.used ? 'used' : 'unused');
        g.dataset.gpio = pin.gpio;
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', pos.x); c.setAttribute('cy', pos.y); c.setAttribute('r', 5);
        c.setAttribute('fill', BUS[pin.bus]?.color || '#64748b');
        c.setAttribute('stroke', '#0b0f14');
        g.appendChild(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', side === 'left' ? pos.x - 8 : pos.x + 8);
        t.setAttribute('y', pos.y + 3);
        t.setAttribute('text-anchor', side === 'left' ? 'end' : 'start');
        t.setAttribute('fill', '#cbd5e1'); t.setAttribute('font-size', '8');
        t.setAttribute('font-family', 'ui-monospace, monospace');
        t.textContent = `${pin.label} (${pin.hdr}-${pin.hole})`;
        g.appendChild(t);
        g.addEventListener('mouseenter', () => highlight('esp', pin.gpio));
        g.addEventListener('mouseleave', () => highlight(null));
        gEsp.appendChild(g);
      });
      svg.appendChild(gEsp);

      const gMods = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      MODULES.forEach(mod => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.classList.add('mod-box');
        g.dataset.mod = mod.id;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('x', mod.x); r.setAttribute('y', mod.y);
        r.setAttribute('width', mod.w); r.setAttribute('height', mod.h);
        r.setAttribute('rx', 8); r.setAttribute('fill', '#1c2636'); r.setAttribute('stroke', '#475569'); r.setAttribute('stroke-width', 1.5);
        g.appendChild(r);
        const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t1.setAttribute('x', mod.x + mod.w/2); t1.setAttribute('y', mod.y + 18);
        t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('fill', '#eef4fc');
        t1.setAttribute('font-size', '11'); t1.setAttribute('font-weight', '600');
        t1.textContent = mod.label;
        g.appendChild(t1);
        const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t2.setAttribute('x', mod.x + mod.w/2); t2.setAttribute('y', mod.y + 30);
        t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('fill', '#8fa3bf'); t2.setAttribute('font-size', '8');
        t2.textContent = mod.sub;
        g.appendChild(t2);

        const pins = getModPins(mod.id);
        pins.forEach((pname, i) => {
          const mp = modPinPos(mod, pname, i, pins.length);
          const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          tx.setAttribute('x', mod.side === 'left' ? mod.x + 6 : mod.x + mod.w - 6);
          tx.setAttribute('y', mp.y + 3);
          tx.setAttribute('text-anchor', mod.side === 'left' ? 'start' : 'end');
          tx.setAttribute('fill', '#fcd34d'); tx.setAttribute('font-size', '7.5');
          tx.setAttribute('font-family', 'ui-monospace, monospace');
          tx.textContent = pname;
          g.appendChild(tx);
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', mp.x); dot.setAttribute('cy', mp.y); dot.setAttribute('r', 3);
          dot.setAttribute('fill', '#475569');
          g.appendChild(dot);
        });

        g.addEventListener('click', () => { state.mod = mod.id; document.getElementById('mod-filter').value = mod.id; refresh(); });
        gMods.appendChild(g);
      });
      svg.appendChild(gMods);
    }

    function renderAside() {
      const list = document.getElementById('aside-list');
      const nets = filteredNet();
      document.getElementById('aside-title').textContent = state.mod ? `Kết nối: ${state.mod}` : `Tất cả kết nối (${nets.length})`;
      list.innerHTML = nets.map(n => {
        const hl = state.hl === n.id || state.hl === n.esp || state.hl === n.mod ? 'hl' : '';
        const espTxt = n.esp === '—' ? '—' : `${n.esp} <span style="color:#64748b">(${n.hdr})</span>`;
        const note = n.note ? `<div style="font-size:0.65rem;color:#64748b;padding:0 0.4rem 0.3rem 0.4rem">${n.note}</div>` : '';
        return `<div class="pin-row ${hl}" data-id="${n.id}" data-esp="${n.esp}" data-mod="${n.mod}">
          <span class="esp">${espTxt}</span><span class="arr">↔</span>
          <span class="mod">${n.mod} · ${n.pin}</span></div>${note}`;
      }).join('');
      list.querySelectorAll('.pin-row').forEach(el => {
        el.addEventListener('mouseenter', () => highlight('id', el.dataset.id));
        el.addEventListener('mouseleave', () => highlight(null));
        el.addEventListener('click', () => highlight('id', el.dataset.id, true));
      });
    }

    function renderNetlist() {
      const tbody = document.getElementById('net-body');
      tbody.innerHTML = filteredNet().map(n => {
        const hl = state.hl === n.id ? 'hl' : '';
        return `<tr class="data ${hl}" data-id="${n.id}">
          <td><span style="color:${BUS[n.bus].color}">${BUS[n.bus].label}</span></td>
          <td><code>${n.esp}</code> <small style="color:#64748b">${n.hdr}</small></td>
          <td>↔</td><td>${n.mod}</td><td><code>${n.pin}</code></td><td>${n.note}</td></tr>`;
      }).join('');
      tbody.querySelectorAll('tr').forEach(tr => {
        tr.addEventListener('click', () => highlight('id', tr.dataset.id, true));
      });
    }

    async function renderMermaid() {
      const buses = [...state.buses];
      let code = 'flowchart LR\n';
      code += '  subgraph ESP["ESP32-S3"]\n';
      const espPins = [...new Set(filteredNet().filter(n=>n.esp!=='—').map(n=>n.esp))];
      espPins.forEach(p => { code += `    E_${p.replace(/[^a-zA-Z0-9]/g,'')}["${p}"]\n`; });
      code += '  end\n';
      const mods = [...new Set(filteredNet().map(n=>n.mod).filter(m=>m!=='*'))];
      mods.forEach(m => {
        const id = m.replace(/[^a-zA-Z0-9]/g,'');
        code += `  subgraph M_${id}["${m}"]\n`;
        const pins = [...new Set(filteredNet().filter(n=>n.mod===m).map(n=>n.pin))];
        pins.forEach(p => { code += `    ${id}_${p.replace(/[^a-zA-Z0-9]/g,'')}["${p}"]\n`; });
        code += '  end\n';
      });
      filteredNet().forEach(n => {
        if (n.esp === '—' || n.mod === '*') return;
        const e = `E_${n.esp.replace(/[^a-zA-Z0-9]/g,'')}`;
        const mid = n.mod.replace(/[^a-zA-Z0-9]/g,'');
        const mp = `${mid}_${n.pin.replace(/[^a-zA-Z0-9]/g,'')}`;
        code += `  ${e} <-->|${n.bus}| ${mp}\n`;
      });
      const el = document.getElementById('mermaid-diagram');
      el.textContent = code;
      el.removeAttribute('data-processed');
      await mermaid.run({ nodes: [el] });
    }

    function highlight(kind, val, sticky) {
      if (!sticky && kind === null) { if (!state.sticky) state.hl = null; }
      else if (kind === 'id') { state.hl = val; state.sticky = !!sticky; }
      else if (kind === 'esp') state.hl = val;
      else if (kind === 'mod') state.hl = val;
      if (!sticky && kind === null) state.sticky = false;
      drawHarness();
      renderAside();
      renderNetlist();
    }

    function buildBusFilters(containerId, onChange) {
      const c = document.getElementById(containerId);
      c.innerHTML = Object.entries(BUS).map(([k,v]) =>
        `<label><input type="checkbox" data-bus="${k}" checked> <span style="color:${v.color}">${v.label}</span></label>`
      ).join('');
      c.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', () => {
          if (inp.checked) state.buses.add(inp.dataset.bus);
          else state.buses.delete(inp.dataset.bus);
          onChange();
        });
      });
    }

    function refresh() {
      drawHarness();
      renderAside();
      renderNetlist();
      if (document.getElementById('view-mermaid').classList.contains('on')) renderMermaid();
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
        btn.classList.add('on');
        document.getElementById('view-' + btn.dataset.view).classList.add('on');
        if (btn.dataset.view === 'mermaid') renderMermaid();
      });
    });

    const mods = [...new Set(NET.map(n => n.mod).filter(m => m !== '*'))].sort();
    const sel = document.getElementById('mod-filter');
    mods.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); });
    sel.addEventListener('change', () => { state.mod = sel.value; refresh(); });
    document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; refresh(); });
    document.getElementById('reset-hl').addEventListener('click', () => { state.hl = null; state.mod = ''; state.sticky = false; sel.value = ''; refresh(); });

    buildBusFilters('bus-filters', refresh);
    buildBusFilters('aside-bus', refresh);
    buildBusFilters('mermaid-filters', () => { if (document.getElementById('view-mermaid').classList.contains('on')) renderMermaid(); refresh(); });

    let scale = 1;
    const wrap = document.getElementById('harness-wrap');
    const zlbl = document.getElementById('zoom-lbl');
    function setZoom(z) { scale = Math.max(0.5, Math.min(2, z)); svg.style.transform = `scale(${scale})`; svg.style.transformOrigin = '0 0'; zlbl.textContent = Math.round(scale*100)+'%'; }
    document.getElementById('zoom-in').onclick = () => setZoom(scale + 0.1);
    document.getElementById('zoom-out').onclick = () => setZoom(scale - 0.1);

    refresh();
  </script>
</body>
</html>
